    function donutHTML(pct){
      const r = 70, c = 2*Math.PI*r, off = c*(1-pct/100);
      return `
        <svg class="big-donut" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="16"></circle>
          <circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--lime)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 90 90)"></circle>
        </svg>
        <div class="donut-label">${pct}%</div>`;
    }

    function phaseDates(){
      const out = [];
      let d = PHASE_START;
      while(d <= PHASE_END){ out.push(d); d = addDays(d, 1); }
      return out;
    }

    function phaseSummaryHTML(){
      const dates = phaseDates();
      const trained = dates.filter(iso=>daySetsDone(iso) > 0).length;
      const planned = dates.filter(iso=>planFor(iso).exercises.length > 0).length;
      const sets = dates.reduce((s,iso)=>s + daySetsDone(iso), 0);
      const ton = dates.reduce((s,iso)=>s + dayTonnage(iso), 0);
      const past = dates.filter(iso=>iso <= todayISO());
      const pastPlanned = past.filter(iso=>planFor(iso).exercises.length > 0).length;
      const adherence = pastPlanned ? Math.round(past.filter(iso=>planFor(iso).exercises.length > 0 && daySetsDone(iso) > 0).length / pastPlanned * 100) : 0;
      return `
        <div class="kpi-grid">
          <div class="kpi"><b>${trained}/${planned}</b><span>Sessões</span></div>
          <div class="kpi"><b>${sets}</b><span>Séries</span></div>
          <div class="kpi"><b>${ton >= 1000 ? (ton/1000).toFixed(1) + "t" : Math.round(ton)}</b><span>Tonelagem</span></div>
        </div>
        <div class="kpi-grid" style="margin-top:8px">
          <div class="kpi"><b>${adherence}%</b><span>Aderência</span></div>
          <div class="kpi"><b>${daysLeft()}</b><span>Dias restantes</span></div>
          <div class="kpi"><b>${(state.archive||[]).length}</b><span>Arquivadas</span></div>
        </div>
        <p class="hint">Aderência = dias de musculação já passados em que você registrou pelo menos uma série. Em cutting, consistência vale mais que sessão perfeita.</p>`;
    }

    function tonnageChartHTML(){
      const dates = blockDates(selectedBlock).filter(iso=>dayTonnage(iso) > 0);
      if(!dates.length) return '<div class="empty">Sem tonelagem registrada neste bloco. Preencha carga e repetições para ver as barras.</div>';
      const vals = dates.map(dayTonnage);
      const max = Math.max(...vals);
      const bars = dates.map((iso,i)=>{
        const h = Math.max(3, Math.round(vals[i] / max * 100));
        return '<div class="vol-bar" title="' + Math.round(vals[i]) + ' kg"><i style="height:' + h + '%"></i><b>' + shortDate(iso).slice(0,5) + '</b></div>';
      }).join("");
      return '<div class="vol-bars">' + bars + '</div>' +
        '<p class="hint">Tonelagem = soma de carga × repetições. Em déficit, é normal ela oscilar; o alarme é uma queda contínua por mais de duas sessões seguidas no mesmo treino.</p>';
    }

    function plannedVolumeByMuscle(){
      const out = {};
      blockDates(selectedBlock).forEach(iso=>{
        planFor(iso).exercises.forEach(ex=>{
          Object.entries(ex.muscles||{}).forEach(([m,v])=>out[m] = (out[m]||0) + v);
        });
      });
      return out;
    }
    function completedVolumeByMuscle(n){
      const out = {};
      blockDates(n).forEach(iso=>{
        planFor(iso).exercises.forEach(ex=>{
          const entry = state.days[iso]?.exercises?.[ex.id];
          const done = entry ? entry.sets.filter(s=>s.done).length : 0;
          Object.keys(ex.muscles||{}).forEach(m=>out[m] = (out[m]||0) + done);
        });
      });
      return out;
    }
    function volumeSummaryHTML(){
      const planned = plannedVolumeByMuscle();
      const current = completedVolumeByMuscle(selectedBlock);
      const keys = Object.keys(planned).filter(k=>MUSCLE_ORDER.includes(k));
      if(!keys.length) return '<div class="empty">Sem volume planejado neste bloco.</div>';
      return keys.map(k=>{
        const pct = planned[k] ? Math.min(100, Math.round((current[k]||0) / planned[k] * 100)) : 0;
        return `<div class="bar-line">
          <span>${esc(k)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span>${current[k]||0}/${planned[k]}</span>
        </div>`;
      }).join("") + '<p class="hint">Séries efetivas feitas / planejadas no bloco. Abaixo de 10 séries semanais num grupo, a chance de perder massa em déficit cresce — priorize fechar os grupos vermelhos antes de adicionar cardio.</p>';
    }

    function bodyweightHTML(){
      const pts = phaseDates()
        .filter(iso=>state.days[iso] && state.days[iso].bodyweight !== "" && state.days[iso].bodyweight !== undefined)
        .map(iso=>({iso, v:Number(state.days[iso].bodyweight)}))
        .filter(p=>!Number.isNaN(p.v) && p.v > 0);
      if(pts.length < 2) return '<div class="empty">Registre o peso corporal em pelo menos 2 dias (campo no fim da tela de treino) para ver a tendência da fase.</div>';
      const first = pts[0], last = pts[pts.length-1];
      const diff = last.v - first.v;
      const perWeek = diff / Math.max(1, diffDays(last.iso, first.iso)) * 7;
      const kind = diff < -0.05 ? "up" : (diff > 0.05 ? "down" : "flat");
      return lineChart(pts.map(p=>p.v), "Peso corporal (" + unitLabel() + ")") +
        `<div class="row-between" style="margin-top:12px">
          <span class="banner-text" style="margin:0">${esc(shortDate(first.iso))} → ${esc(shortDate(last.iso))}</span>
          <span class="delta ${kind}">${diff > 0 ? "+" : ""}${esc(toDisplayWeight(Math.round(diff*10)/10))} ${esc(unitLabel())}</span>
        </div>
        <p class="hint">Ritmo atual: <strong>${(perWeek>0?"+":"") + (Math.round(perWeek*100)/100)} ${esc(unitLabel())}/semana</strong>. Numa fase de corte, 0,4% a 0,8% do peso por semana costuma ser o intervalo que preserva músculo. Perder rápido demais custa força.</p>`;
    }

    function prsHTML(){
      const prs = {};
      movementCatalog().forEach(mv=>{
        sessionsByKey(mv.key).forEach(s=>{
          const m = sessionMetrics(s.entry);
          if(!m.e1rm) return;
          if(!prs[mv.key] || m.e1rm > prs[mv.key].e1rm){
            prs[mv.key] = {e1rm:m.e1rm, set:m.best, date:s.date, name:mv.pt, en:mv.en};
          }
        });
      });
      const rows = Object.values(prs)
        .sort((a,b)=>b.e1rm - a.e1rm)
        .map(pr=>`<div class="pr-row">
          <div><strong>${esc(pr.name)}</strong><small>${esc(pr.en)} · ${esc(shortDate(pr.date))}</small></div>
          <div style="text-align:right">${esc(toDisplayWeight(pr.set.w))} ${esc(unitLabel())} × ${esc(pr.set.r)}<small>e1RM ${esc(toDisplayWeight(Math.round(pr.e1rm*10)/10))}</small></div>
        </div>`);
      return rows.length ? rows.join("") : '<div class="empty">Sem recordes ainda. Registre carga e repetições para o app calcular seu 1RM estimado.</div>';
    }

    /* ============================================================
       16. BLOCO (visão geral)
       ============================================================ */
    function renderWeek(){
      const root = document.getElementById("weekContent");
      root.innerHTML = blockDates(selectedBlock).map(iso=>{
        const plan = planFor(iso);
        const s = dayStats(iso);
        const items = plan.exercises.length
          ? plan.exercises.map(ex=>{
              const done = exerciseCompleted(iso, ex);
              return `<div class="mini-ex ${done?'done':''}"><span>${esc(ex.pt)}</span><span>${done?'✓':'○'}</span></div>`;
            }).join("")
          : `<div class="mini-ex ${cardioDone(iso)?'done':''}"><span>${plan.cardio ? esc(plan.cardio.title) : "Descanso"}</span><span>${plan.cardio ? (cardioDone(iso)?'✓':'○') : '—'}</span></div>`;
        const cardioRow = plan.exercises.length && plan.cardio
          ? `<div class="mini-ex ${cardioDone(iso)?'done':''}"><span>${esc(plan.cardio.title)}</span><span>${cardioDone(iso)?'✓':'○'}</span></div>` : "";
        return `<section class="week-day glass">
          <div class="row-between" style="margin-bottom:8px">
            <h3 style="margin:0">${esc(WEEKDAY_SHORT[weekdayKey(iso)])} ${esc(shortDate(iso))}</h3>
            <span class="tag ${s.pct===100 && s.unitsTotal ? 'lime':''}">${s.isRest ? "OFF" : s.pct + "%"}</span>
          </div>
          <p class="banner-text" style="margin:0 0 6px">${esc(plan.title)}</p>
          ${items}${cardioRow}
        </section>`;
      }).join("");
    }

    /* ============================================================
       17. CONFIG
       ============================================================ */
    function renderSettings(){
      const root = document.getElementById("settingsContent");
      root.innerHTML = `
        <section class="settings-card glass">
          <div class="settings-row">
            <div><strong>Unidade</strong><div class="banner-text">Converte cargas salvas e exibidas.</div></div>
            <div class="toggle">
              <button id="kgBtn" class="${state.settings.unit==='kg'?'active':''}">kg</button>
              <button id="lbBtn" class="${state.settings.unit==='lb'?'active':''}">lb</button>
            </div>
          </div>
          <div class="settings-row">
            <div><strong>Período da fase</strong><div class="banner-text">06/08/2026 → 31/08/2026 · ${PHASE_LENGTH} dias · ${BLOCK_COUNT} blocos</div></div>
            <span class="tag lime">${daysLeft()} dias</span>
          </div>
          <div class="settings-row">
            <div><strong>Exportar dados</strong><div class="banner-text">Baixa o JSON completo (dias + arquivo de sessões).</div></div>
            <button class="btn lime" id="exportBtn">Exportar</button>
          </div>
          <div class="settings-row">
            <div><strong>Importar backup</strong><div class="banner-text">Substitui os dados atuais pelo arquivo escolhido.</div></div>
            <button class="btn" id="importBtn">Importar</button>
          </div>
          <div class="settings-row">
            <div><strong>Resetar bloco ${selectedBlock}</strong><div class="banner-text">Limpa as marcações de ${blockLabel(selectedBlock)}. Cargas, reps e notas são mantidas.</div></div>
            <button class="btn danger" id="resetBlockBtn">Resetar</button>
          </div>
          <div class="settings-row">
            <div><strong>Apagar tudo</strong><div class="banner-text">Remove todos os dias e o arquivo de sessões deste navegador.</div></div>
            <button class="btn danger" id="wipeBtn">Apagar</button>
          </div>
          <div class="settings-row">
            <div><strong>App</strong><div class="banner-text">FASE 5 — Cutting · versão ${APP_VERSION} · dados salvos apenas neste navegador</div></div>
          </div>
        </section>`;

      document.getElementById("kgBtn").addEventListener("click", ()=>setUnit("kg"));
      document.getElementById("lbBtn").addEventListener("click", ()=>setUnit("lb"));
      document.getElementById("exportBtn").addEventListener("click", exportData);
      document.getElementById("importBtn").addEventListener("click", ()=>document.getElementById("importFile").click());
      document.getElementById("resetBlockBtn").addEventListener("click", resetBlockChecks);
      document.getElementById("wipeBtn").addEventListener("click", wipeAll);
    }

    function setUnit(unit){
      state.settings.unit = unit;
      saveState();
      renderAll();
      showToast("Unidade: " + unit);
    }
    function exportData(){
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "training_tracker_" + todayISO() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
    document.getElementById("importFile").addEventListener("change", e=>{
      const file = e.target.files?.[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const parsed = JSON.parse(reader.result);
          if(!parsed || typeof parsed !== "object") throw new Error("formato");
          if(!confirm("Substituir todos os dados atuais pelo backup?")) return;
          state = {
            version: 2,
            days: parsed.days || {},
            archive: Array.isArray(parsed.archive) ? parsed.archive : [],
            settings: Object.assign(baseState().settings, parsed.settings || {})
          };
          saveState(); renderAll();
          showToast("Backup importado");
        }catch(err){ showToast("Arquivo inválido"); }
        finally{ e.target.value = ""; }
      };
      reader.readAsText(file);
    });
    function resetBlockChecks(){
      if(!confirm("Limpar as marcações do bloco " + selectedBlock + "? Cargas, reps e notas continuam salvas.")) return;
      blockDates(selectedBlock).forEach(iso=>{
        const d = state.days[iso];
        if(!d) return;
        Object.values(d.exercises||{}).forEach(e=>{
          (e.sets||[]).forEach(s=>{ s.done = false; s.ts = null; });
          e.completedAt = null; e.expanded = false;
        });
        Object.values(d.cardio||{}).forEach(c=>{ c.done = false; });
      });
      saveState(); renderAll();
      showToast("Bloco " + selectedBlock + " resetado");
    }
    function wipeAll(){
      if(!confirm("Apagar TODOS os dados de treino deste navegador? Isso não pode ser desfeito.")) return;
      if(!confirm("Confirmar de novo: apagar tudo?")) return;
      state = baseState();
      saveState(); renderAll();
      showToast("Tudo apagado");
    }

    /* ============================================================
       18. NAVEGAÇÃO
       ============================================================ */
    document.querySelectorAll(".nav-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        currentScreen = btn.dataset.screen;
        document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b === btn));
        document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
        document.getElementById("screen-" + currentScreen).classList.add("active");
        window.scrollTo({top:0, behavior:"smooth"});
        if(currentScreen === "loads") renderLoads();
        if(currentScreen === "progress") renderProgress();
        if(currentScreen === "week") renderWeek();
        if(currentScreen === "settings") renderSettings();
      });
    });

    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "visible" && timer.active) requestWakeLock();
    });

    renderAll();
  </script>
</body>
</html>
